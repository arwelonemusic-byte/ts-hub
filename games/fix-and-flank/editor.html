<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактор карт · Fix and Flank</title>
  <link rel="icon" href="assets/icons/ts-mark.svg">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/ui.css">
  <style>
    /* Editor-only parts; the rest is assets/ui.css, shared with the game. */
    .brand .where { font: 500 14px/20px var(--sans); color: var(--secondary); white-space: nowrap; }
    #mapName {
      width: min(320px, 22vw); height: 36px; padding: 0 12px; text-align: center;
      background: var(--inset); border: 1px solid var(--line); border-radius: 8px; color: var(--fg); font: 500 15px/20px var(--slab);
    }
    #mapName:focus { outline: none; border-color: var(--accent); }
    .bar .btn { height: 36px; }
    /* The editor's bar: the right side takes what its buttons need (the hub's Russian labels are long), the name the rest. */
    @media (min-width: 1101px) { .bar { grid-template-columns: auto minmax(0, 1fr) auto; } #mapName { justify-self: center; max-width: 100%; } }
    .bar .right > * { flex: none; }
    .bar .btn.primary { min-width: 0; height: 36px; padding: 0 16px; font-size: 14px; }

    #tools {
      left: var(--gap); top: var(--gap); width: 312px; max-height: calc(100% - 2 * var(--gap));
      display: flex; flex-direction: column; gap: 18px; padding: 20px; overflow-y: auto;
    }
    #tools > section { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }

    .palette { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .tile, .tool {
      position: relative; border: 1px solid transparent; border-radius: 8px; background: var(--inset); color: var(--secondary);
      cursor: pointer; transition: border-color 0.15s, transform 0.15s;
    }
    .tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 6px; font: 500 11px/14px var(--sans); }
    .tile .sw { width: 26px; height: 26px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
    .tile kbd { position: absolute; top: 3px; right: 3px; min-width: 15px; padding: 0 3px; font-size: 9px; line-height: 14px; }
    .tile:hover, .tool:hover { border-color: var(--line-strong); color: var(--fg); }
    .tile.on, .tool.on { border-color: var(--accent); color: var(--fg); background: linear-gradient(var(--accent-subtle), var(--accent-subtle)), var(--inset); }
    .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .tool { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; font: 500 13px/20px var(--sans); text-align: left; }
    .tool svg { width: 18px; height: 18px; flex: none; }
    .tool kbd { margin-left: auto; }
    .row2 .btn, .btn.block { width: 100%; }
    .col1 { display: grid; gap: 6px; }

    .edock { position: absolute; z-index: 3; left: 50%; bottom: var(--gap); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(720px, calc(100% - 2 * var(--gap))); pointer-events: none; }
    .edock > * { pointer-events: auto; }
    #hubState { font: 500 12px/16px var(--sans); color: var(--tertiary); white-space: nowrap; }
    #hubState.bad { color: var(--danger); }
    .brand.home { cursor: pointer; }
    #where { flex: none; margin-left: 8px; font: 700 11px/20px var(--mono); letter-spacing: 0.06em; color: var(--accent); }
    #where:empty { display: none; }
    #check { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; box-shadow: var(--shadow); font: 500 13px/20px var(--sans); }
    #check.ready { background: #1f3323; color: var(--success); }
    #check.bad { background: #3a2321; color: var(--danger); }
    #check i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .menuwrap { position: relative; }
    .menu {
      position: absolute; right: 0; top: 44px; z-index: 20; width: 300px; max-height: 70vh; overflow-y: auto; padding: 6px;
      background: var(--surface); border-radius: 8px; box-shadow: var(--shadow), inset 0 0 0 1px var(--line-strong);
    }
    .menu .eyebrow { padding: 8px 10px 4px; }
    .menu .item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: none; color: var(--body); font: 400 14px/20px var(--sans); text-align: left; cursor: pointer; }
    .menu .item:hover { background: var(--raised); color: var(--fg); }
    .menu .item small { margin-left: auto; color: var(--tertiary); font-size: 12px; white-space: nowrap; }
    .menu .item .del { margin-left: auto; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 4px; color: var(--disabled); }
    .menu .item .del:hover { color: var(--danger); background: var(--surface); }
    .menu hr { border: 0; height: 1px; background: var(--line); margin: 6px 4px; }
    .menu .empty { padding: 6px 10px; color: var(--tertiary); font-size: 13px; }

    #toast { position: absolute; z-index: 6; left: 50%; top: var(--gap); transform: translateX(-50%); padding: 9px 16px; border-radius: 8px; background: var(--overlay); box-shadow: var(--shadow); font: 500 13px/20px var(--sans); color: var(--fg); animation: rise 0.2s ease-out; }
    #toast.bad { color: var(--danger); }
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="assets/icons/ts-mark.svg" alt="">
      <span class="app">Fix and Flank</span>
      <span class="sep"></span>
      <span class="where">Редактор карт</span>
    </div>
    <input id="mapName" maxlength="40" spellcheck="false" aria-label="Название карты">
    <div class="right">
      <button class="iconbtn" id="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="iconbtn" id="redo" title="Вернуть (Ctrl+Y)" aria-label="Вернуть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <div class="menuwrap">
        <button class="btn" id="mapsBtn" aria-haspopup="true" aria-expanded="false">Карты <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="menu thin" id="mapsMenu" hidden></div>
      </div>
      <!-- Served by the TS Hub: drafts are kept there and published from there (src/editor/hub.js). -->
      <span id="hubState" hidden></span>
      <button class="btn" id="saveDraft" title="Сохранить карту черновиком в хабе (Ctrl+S). Пока вы её не опубликуете, её видите только вы." hidden>Сохранить</button>
      <button class="btn" id="playtest" title="Сыграть черновик самому. Тестовые игры не засчитываются." hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>Тест</button>
      <button class="btn primary" id="publish" title="Выложить карту в хаб для всех. Опубликованную карту больше нельзя менять." hidden>Опубликовать</button>
      <button class="btn primary" id="play" title="Сыграть эту карту (сохраняет её в «Мои карты»)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>Играть</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="board" aria-label="Карта"></canvas>

    <aside class="panel thin" id="tools">
      <section>
        <div class="eyebrow">Карта</div>
        <button class="btn block" id="randomize" title="Совсем новая случайная карта (R): местность, изгороди и стены, старт BLUFOR и группа OPFOR на объекте. Всё, что есть на карте сейчас, пропадёт; Ctrl+Z вернёт."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Случайная карта</button>
      </section>

      <section>
        <div class="eyebrow">Местность</div>
        <div class="palette" id="palette"></div>
      </section>

      <section>
        <div class="eyebrow">Стороны гексов</div>
        <div class="row2" id="sideTools">
          <button class="tool" data-tool="wall"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7h18v12H3zM3 13h18M9 7v6M15 7v6M12 13v6M6 13v6M18 13v6"/></svg>Стена<kbd>W</kbd></button>
          <button class="tool" data-tool="hedge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 18a4 4 0 0 1 3-6.5 4.5 4.5 0 0 1 8.5-1.5 4 4 0 0 1 6.5 3.5V18z"/></svg>Изгородь<kbd>H</kbd></button>
          <button class="tool" data-tool="parapet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="13" width="8" height="5" rx="2"/><rect x="13" y="13" width="8" height="5" rx="2"/><rect x="8" y="7" width="8" height="5" rx="2"/></svg>Бруствер<kbd>P</kbd></button>
          <button class="tool" data-tool="erase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4-4 11-11 7 7-8 8z"/><path d="M7 21h14M9 11l7 7"/></svg>Стереть<kbd>X</kbd></button>
        </div>
      </section>

      <section>
        <div class="eyebrow">Силы</div>
        <div class="col1" id="forceTools">
          <button class="tool" data-tool="start"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="6" width="18" height="12" fill="#80e0ff" stroke="#0d0f11"/><path d="M3 6l18 12M21 6 3 18" stroke="#0d0f11"/></svg>Старт BLUFOR<kbd>B</kbd></button>
          <button class="tool" data-tool="objective"><svg viewBox="0 0 24 24" fill="none" stroke="#f4db50" stroke-width="2" stroke-dasharray="3 2"><path d="M12 2 21 7v10l-9 5-9-5V7z"/></svg>Объект<kbd>O</kbd></button>
          <button class="tool" data-tool="enemy"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2 22 12 12 22 2 12z" fill="#ff8080" stroke="#0d0f11"/><path d="m8 8 8 8M16 8l-8 8" stroke="#0d0f11"/></svg>Группа OPFOR<kbd>F</kbd></button>
        </div>
      </section>
    </aside>

    <div class="hud" id="hud" aria-label="Управление картой">
      <button id="zoomIn" title="Приблизить (колесо)" aria-label="Приблизить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoomOut" title="Отдалить (колесо)" aria-label="Отдалить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="fitBtn" title="Показать всю карту (Home)" aria-label="Показать всю карту"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button id="turnLeft" title="Повернуть вид (Q)" aria-label="Повернуть влево"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button id="turnRight" title="Повернуть вид (E)" aria-label="Повернуть вправо"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>

    <div class="edock" id="dock">
      <div id="check" role="status"></div>
      <div class="hint" id="hint"><i class="dot"></i><div id="help"></div><span id="where"></span></div>
    </div>
    <div id="toast" hidden></div>
  </main>

  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div id="status" role="alert"></div>
  <script type="module" src="src/editor/editor.js"></script>
</body>
</html>
