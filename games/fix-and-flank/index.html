<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fix and Flank</title>
  <link rel="icon" href="assets/icons/ts-mark.svg">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/ui.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="assets/icons/ts-mark.svg" alt="">
      <span class="app">Fix and Flank</span>
      <span class="sep"></span>
      <h1 id="mission">Загрузка…</h1>
    </div>
    <nav id="phases" aria-label="Фазы хода"></nav>
    <div class="right">
      <span id="contacts" class="chip">Контакта нет</span>
      <div class="turnbox"><span class="eyebrow">Ход</span><span id="turn">1</span></div>
      <a class="iconbtn" id="editBtn" href="editor.html" title="Открыть карту в редакторе" aria-label="Редактор карт">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </a>
      <button class="iconbtn" id="helpBtn" title="Как играть (F1)" aria-label="Как играть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="board" aria-label="Карта"></canvas>

    <aside class="panel thin" id="phaseCard">
      <div class="phasehead">
        <div class="eyebrow" id="phaseKicker">Приказы</div>
        <h2 id="phaseName">Движение</h2>
      </div>
      <div class="progress" aria-hidden="true"><i id="progress"></i></div>
      <section class="section">
        <div class="eyebrow">Отделение · BLUFOR</div>
        <div id="units"></div>
      </section>
      <!-- Hints and messages: at the bottom of the panel (user request 2026-10-15), not over the map. -->
      <div class="hint" id="hint" aria-live="polite"><i class="dot"></i><div><span id="preview"></span> <span id="message"></span></div></div>
    </aside>

    <div class="hud" id="hud" aria-label="Управление картой">
      <button id="zoomIn" title="Приблизить (колесо)" aria-label="Приблизить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoomOut" title="Отдалить (колесо)" aria-label="Отдалить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="fitBtn" title="Показать всю карту (Home)" aria-label="Показать всю карту"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button id="turnLeft" title="Повернуть вид (Q)" aria-label="Повернуть влево"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button id="turnRight" title="Повернуть вид (E)" aria-label="Повернуть вправо"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>

    <aside class="panel thin" id="hexcard" aria-live="polite"></aside>
    <div id="unitTip" hidden></div>

    <div class="dock">
      <div id="dice" hidden aria-live="polite"></div>
      <div class="actions" id="actions">
        <button class="btn" id="clear" title="Отменить все приказы">Сбросить всё</button>
        <button class="btn" id="view" title="Затемнить то, чего отделение не видит; наведите на подразделение (или выберите его), чтобы увидеть его обзор (V)">Обзор <kbd>V</kbd></button>
        <span class="sep"></span>
        <button class="btn primary" id="commit" title="Выполнить приказы (Пробел)"><span id="commitLabel">Выполнить приказы</span> <kbd>Пробел</kbd></button>
      </div>
      <!-- «Повтор»: instead of the orders' buttons, the replay's (src/ui/app.js). -->
      <div class="actions" id="replayBar" hidden>
        <button class="btn" id="replayExit" title="Выйти из повтора на страницу карты в хабе">Выйти из повтора</button>
        <span class="sep"></span>
        <span id="replayTurn"></span>
        <button class="btn" id="replayBack" title="К началу хода; ещё раз — к предыдущему ходу" aria-label="Предыдущий ход"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 19 8 12l10-7z"/><rect x="5" y="5" width="2.5" height="14" rx="1"/></svg></button>
        <button class="btn primary" id="replayPlay" title="Пауза и продолжение (Пробел)"><svg id="replayIconPause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg id="replayIconPlay" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M7 4.5v15l12-7.5z"/></svg><span id="replayPlayLabel">Пауза</span> <kbd>Пробел</kbd></button>
        <button class="btn" id="replayFwd" title="К следующему ходу" aria-label="Следующий ход"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m6 5 10 7-10 7z"/><rect x="16.5" y="5" width="2.5" height="14" rx="1"/></svg></button>
      </div>
    </div>
  </main>

  <div id="modal" hidden></div>
  <div id="status" role="alert"></div>

  <template id="helpTpl">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <header>
        <div><div class="eyebrow">Fix and Flank</div><h2 id="helpTitle">Как играть</h2></div>
        <button class="iconbtn" data-close aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </header>
      <div class="body">
        <p><b>Каждый ход:</b> Движение (подразделения перемещаются; кто двигался, в этот ход не стреляет), Огонь (стреляют те, кто не двигался), Восстановление (само: подавленные и прижатые бросают кубик, чтобы прийти в себя; с SL в гексе — наверняка, иначе бросок должен превысить расстояние до него), Ход противника.</p>
        <p><b>Приказы:</b> нажмите на своё подразделение (фишку или бойцов), затем на гекс, или перетащите его на гекс. В фазе движения: синий гекс — движение на 1 гекс, жёлтый — перебежка на 2 (подразделение на виду), красное кольцо рядом с группой — штурм противника в этом гексе. В фазе огня: любой гекс в закрашенной зоне; синее кольцо — обнаруженный противник (прицельный огонь), красное кольцо рядом — штурм, всё остальное — огонь на подавление. Наведите на гекс, чтобы увидеть, что там, а с выбранным подразделением — кубики и шансы приказа. Группы OPFOR могут делить огонь между двумя вашими подразделениями (кубики делятся), но не когда ваше подразделение рядом с ними. Новый приказ заменяет старый; приказы выполняются в порядке отдачи; без приказа подразделение остаётся на месте.</p>
        <p><b>Фишки:</b> синий прямоугольник — BLUFOR, красный ромб — OPFOR, буква — группа (SL — командир отделения), точки внизу — оставшиеся бойцы. Жёлтый значок с одним шевроном: подавлена (не может двигаться). Тёмно-красный значок с двумя шевронами и штриховкой: прижата (не может ни двигаться, ни стрелять). «!»: на виду (после перебежки). «?»: предполагаемая позиция противника. OPFOR видно, только когда он обнаружен. Фигурки под фишкой показывают то же: по одной на бойца, пригнувшись — подавлены, лёжа — прижаты.</p>
        <div class="keys">
          <kbd>Пробел</kbd><span>Выполнить приказы</span>
          <kbd>Tab</kbd><span>Следующее подразделение</span>
          <kbd>Esc</kbd><span>Снять выбор (или правая кнопка)</span>
          <kbd>Delete</kbd><span>Отменить приказ выбранного подразделения</span>
          <kbd>V</kbd><span>Обзор: затемняет то, чего отделение не видит; наведите на подразделение или выберите его, чтобы увидеть только его обзор</span>
          <kbd>Home</kbd><span>Вся карта · колесо — масштаб</span>
          <kbd>↑</kbd><span>Сдвинуть вид (стрелки или перетаскивание левой или правой кнопкой)</span>
          <kbd>Q</kbd><span>Повернуть вид (также <kbd>E</kbd> или перетаскивание средней кнопкой)</span>
        </div>
      </div>
      <footer><button class="btn primary" data-close style="min-width: 0">Вернуться к карте</button></footer>
    </div>
  </template>

  <script type="module" src="src/main.js"></script>
</body>
</html>
