<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map preview · Fix and Flank</title>
  <link rel="icon" href="assets/icons/ts-mark.svg">
  <style>
    /* A map turning slowly in 3D, for the hub's map pages (an iframe). No UI. */
    html, body { margin: 0; height: 100%; background: #171b1e; overflow: hidden; }
    #board { display: block; width: 100%; height: 100%; }
    #status { position: absolute; left: 12px; bottom: 10px; font: 12px/16px sans-serif; color: #f26f63; }
  </style>
</head>
<body>
  <canvas id="board" aria-label="Map preview"></canvas>
  <div id="status"></div>
  <script type="module" src="src/preview.js"></script>
</body>
</html>
