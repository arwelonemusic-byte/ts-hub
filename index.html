<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fix and Flank</title>
  <link rel="icon" href="assets/icons/ts-mark.svg">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/ui.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="assets/icons/ts-mark.svg" alt="">
      <span class="app">Fix and Flank</span>
      <span class="sep"></span>
      <h1 id="mission">Loading…</h1>
    </div>
    <nav id="phases" aria-label="Phases of the turn"></nav>
    <div class="right">
      <span id="contacts" class="chip">No contact</span>
      <div class="turnbox"><span class="eyebrow">Turn</span><span id="turn">1</span></div>
      <a class="iconbtn" id="editBtn" href="editor.html" title="Edit this map in the map editor" aria-label="Map editor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </a>
      <button class="iconbtn" id="helpBtn" title="How to play (F1)" aria-label="How to play">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="board" aria-label="Map"></canvas>

    <aside class="panel thin" id="phaseCard">
      <div class="phasehead">
        <div class="eyebrow" id="phaseKicker">Orders</div>
        <h2 id="phaseName">Movement</h2>
        <p id="active"></p>
      </div>
      <div class="progress" aria-hidden="true"><i id="progress"></i></div>
      <section class="section">
        <div class="eyebrow">Squad · BLUFOR</div>
        <div id="units"></div>
      </section>
      <section class="section">
        <div class="eyebrow">Mission</div>
        <div class="brief" id="objective"></div>
      </section>
    </aside>

    <div class="hud" id="hud" aria-label="Map controls">
      <button id="zoomIn" title="Zoom in (wheel)" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoomOut" title="Zoom out (wheel)" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="fitBtn" title="Fit the map (Home)" aria-label="Fit the map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      <button id="turnLeft" title="Turn the view (Q)" aria-label="Turn left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button id="turnRight" title="Turn the view (E)" aria-label="Turn right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>

    <aside class="panel thin" id="hexcard" aria-live="polite"></aside>
    <div id="unitTip" hidden></div>

    <div class="dock">
      <div id="dice" hidden aria-live="polite"></div>
      <div class="hint" id="hint" aria-live="polite"><i class="dot"></i><div><span id="preview"></span> <span id="message"></span></div></div>
      <div class="actions" id="actions">
        <button class="btn" id="hold" title="Take back the selected unit's order (H)">Hold <kbd>H</kbd></button>
        <button class="btn" id="clear" title="Take back every order">Clear all</button>
        <button class="btn" id="view" title="Dim what the squad cannot see; with a unit selected, what that unit cannot see (V)">Line of sight <kbd>V</kbd></button>
        <span class="sep"></span>
        <button class="btn primary" id="commit" title="Carry out the orders (Space)"><span id="commitLabel">Commit orders</span> <kbd>Space</kbd></button>
      </div>
    </div>
  </main>

  <div id="modal" hidden></div>
  <div id="status" role="alert"></div>

  <template id="helpTpl">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <header>
        <div><div class="eyebrow">Fix and Flank</div><h2 id="helpTitle">How to play</h2></div>
        <button class="iconbtn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </header>
      <div class="body">
        <p><b>Each turn:</b> Movement (move your units; a unit that moves cannot fire this turn), Firefight (units that did not move fire), Rally (automatic: suppressed and pinned units roll to recover, sure with the SL in their hex, otherwise the roll must beat the distance to him), Enemy action.</p>
        <p><b>Orders:</b> click one of your units (its counter or its soldiers), then a hex. Movement: blue moves 1 hex, yellow fast moves 2 (exposed), a red ring next to your team assaults the enemy in it. Firefight: any hex in the shaded area; a blue ring is a spotted enemy (aimed fire), a red ring next to you an assault, anything else is suppressive fire. Point at a hex to see what it is and, with a unit selected, the dice and odds of the order. OPFOR teams may split their fire between two of your units (dice divided), but not with one of yours next to them. A new order replaces the old one; orders run in the order given; units without an order hold.</p>
        <p><b>Counters:</b> blue box BLUFOR, red diamond OPFOR, letter = team, dots below = soldiers left. Amber badge, one chevron: suppressed (cannot move). Dark red badge, two chevrons, hatched: pinned (cannot move or fire). "!": exposed (fast moved). "?": suspected enemy position. OPFOR shows only once spotted. The figures under each counter show it too: one per soldier, crouched when suppressed, prone when pinned.</p>
        <div class="keys">
          <kbd>Space</kbd><span>Commit the orders</span>
          <kbd>Tab</kbd><span>Next unit</span>
          <kbd>Esc</kbd><span>Deselect (or right click)</span>
          <kbd>H</kbd><span>Hold: take back the selected unit's order</span>
          <kbd>V</kbd><span>Line of sight: dims what the squad cannot see (the selected unit, when one is)</span>
          <kbd>Home</kbd><span>Fit the map · wheel to zoom</span>
          <kbd>↑</kbd><span>Move the view (the arrow keys, or drag with the left or right button)</span>
          <kbd>Q</kbd><span>Turn the view (also <kbd>E</kbd>, or drag with the middle button)</span>
        </div>
      </div>
      <footer><button class="btn primary" data-close style="min-width: 0">Back to the map</button></footer>
    </div>
  </template>

  <script type="module" src="src/main.js"></script>
</body>
</html>
